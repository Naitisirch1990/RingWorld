name: 14-biome add-on build

on:
  push:
    branches: [codex/14-biomas-worldgen]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ringworld-14-biomes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build 14-biome add-on
        run: ./gradlew -p RingBiomesAddon build --no-daemon

      - name: Upload add-on JAR
        uses: actions/upload-artifact@v4
        with:
          name: ringworld-14-biomes-forge-1.20.1
          path: RingBiomesAddon/build/libs/*.jar
          if-no-files-found: error
