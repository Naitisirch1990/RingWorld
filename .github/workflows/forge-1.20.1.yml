name: Forge 1.20.1 Backport CI

on:
  push:
    branches:
      - port/mc-1.20.1-forge
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile Forge 1.20.1 target
        run: ./gradlew :forge1201:compileJava -PringBackportCompilerScope=forge1201 --dependency-verification=off --stacktrace --no-daemon
