name: Forge 1.20.1 Backport CI

on:
  push:
    branches:
      - port/mc-1.20.1-forge
  workflow_dispatch:

concurrency:
  group: forge-1.20.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build diagnostic Forge 1.20.1 jar with Java 17 toolchain
        run: ./gradlew :forge1201:build -x test -PringBackportCompilerScope=forge1201 --dependency-verification=off --stacktrace --no-daemon

      - name: Verify distributable Forge jar contents
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(forge1201/build/libs/*.jar)
          main_jars=()
          for jar in "${jars[@]}"; do
            [[ "$jar" == *-sources.jar ]] || main_jars+=("$jar")
          done
          [[ "${#main_jars[@]}" -eq 1 ]] || { echo "Expected one main mod JAR, found ${#main_jars[@]}"; exit 1; }
          jar="${main_jars[0]}"
          for entry in META-INF/mods.toml ringworld.forge.mixins.json ringworld.refmap.json \
            dev/ringworld/platform/forge1201/Forge1201DimensionProfiles.class \
            dev/ringworld/platform/forge1201/Forge1201RingRuntime.class \
            dev/ringworld/platform/forge1201/Forge1201ClientTopology.class \
            dev/ringworld/platform/forge1201/client/Forge1201ClientChunkMapAccess.class \
            dev/ringworld/platform/forge1201/client/Forge1201ClientChunkMaps.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201ChunkMapMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201CanonicalChunkHolderMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201ChunkGenerationLookupMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201ServerChunkCacheMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201ChunkTrackerMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201WorldGenRegionMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201PersistentEntitySectionManagerMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201LevelTicksMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201ServerLevelMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201ServerGamePacketListenerMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201ProjectileUtilMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201ClientChunkStorageMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201ClientPacketListenerMixin.class \
            dev/ringworld/platform/forge1201/mixin/Forge1201ClientConnectionMixin.class; do
            if ! unzip -Z1 "$jar" | grep -Fxq "$entry"; then
              echo "Missing required packaged entry: $entry"
              exit 1
            fi
          done
          echo "Forge 1.20.1 JAR contains server topology plus client seam projection/chart classes."

      - name: Validate periodic chunk arithmetic for all project dimensions
        run: |
          mkdir -p "$RUNNER_TEMP/ringworld-core"
          javac -d "$RUNNER_TEMP/ringworld-core" src/main/java/dev/ringworld/world/RingChunkTopology.java forge1201/smoke/RingCoreTopologySmoke.java
          java -cp "$RUNNER_TEMP/ringworld-core" dev.ringworld.platform.forge1201.smoke.RingCoreTopologySmoke

      - name: Smoke boot dedicated Forge server
        shell: bash
        run: |
          mkdir -p forge1201/run-server
          printf 'eula=true\n' > forge1201/run-server/eula.txt
          printf 'motd=RingWorld CI smoke\n' > forge1201/run-server/server.properties
          set +e
          timeout 90s ./gradlew :forge1201:runServer -PringBackportCompilerScope=forge1201 --dependency-verification=off --no-daemon
          status=$?
          set -e
          LOG=forge1201/run-server/logs/latest.log
          if [[ "$status" -eq 124 ]] && [[ -f "$LOG" ]] \
            && grep -q 'Done (' "$LOG" \
            && grep -q 'RingWorld runtime attached to overworld: circumference=61440 width=2000' "$LOG" \
            && grep -q 'RingWorld runtime attached to nether: circumference=30720 width=2000' "$LOG" \
            && grep -q 'RingWorld runtime attached to end: circumference=61440 width=2000' "$LOG" \
            && ! grep -Eq 'Encountered an unexpected exception|Exception caught during firing event|This crash report has been saved' "$LOG"; then
            REGION_DIR=forge1201/run-server/world/region
            python3 - "$REGION_DIR" <<'PY'
          from pathlib import Path
          import re
          import struct
          import sys

          region_dir = Path(sys.argv[1])
          bad = []
          pattern = re.compile(r'^r\.(-?\d+)\.(-?\d+)\.mca$')
          if region_dir.is_dir():
              for path in sorted(region_dir.glob('r.*.*.mca')):
                  match = pattern.match(path.name)
                  if not match or int(match.group(1)) >= 0:
                      continue
                  if path.stat().st_size < 4096:
                      continue
                  with path.open('rb') as handle:
                      header = handle.read(4096)
                  allocated = sum(1 for (entry,) in struct.iter_unpack('>I', header) if entry != 0)
                  if allocated:
                      bad.append((path.name, allocated))
          if bad:
              print('Negative-X region files contain allocated chunks:', bad)
              raise SystemExit(1)
          print('Negative-X speculative region files contain no allocated chunks.')
          PY
            echo 'Dedicated server reached a playable state, all three RingWorld profiles attached, and seam spawn generation stayed on canonical X storage.'
            exit 0
          fi
          echo "Server smoke boot failed or timed out before readiness (status=$status)."
          [[ -f "$LOG" ]] && tail -n 300 "$LOG"
          exit 1

      - name: Diagnose generated region files
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          region_dir = Path('forge1201/run-server/world/region')
          if not region_dir.is_dir():
              print('No Overworld region directory was produced.')
              raise SystemExit(0)
          print('Overworld region-file diagnostics:')
          for path in sorted(region_dir.glob('r.*.*.mca')):
              size = path.stat().st_size
              used = 0
              with path.open('rb') as handle:
                  header = handle.read(4096)
              if len(header) == 4096:
                  used = sum(1 for (entry,) in struct.iter_unpack('>I', header) if entry != 0)
              print(f'{path.name}: bytes={size} allocated_chunks={used}')
          PY

      - name: Smoke boot Forge client mixins
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null || { echo 'xvfb-run is required for the client smoke gate'; exit 1; }
          rm -rf forge1201/run-client/logs forge1201/run-client/crash-reports
          mkdir -p forge1201/run-client
          set +e
          timeout 90s xvfb-run -a ./gradlew :forge1201:runClient -PringBackportCompilerScope=forge1201 --dependency-verification=off --no-daemon 2>&1 | tee forge1201/run-client/console.log
          status=${PIPESTATUS[0]}
          set -e
          LOG=forge1201/run-client/logs/latest.log
          if [[ "$status" -eq 124 ]] && [[ -f "$LOG" ]] \
            && grep -q 'RingWorld Forge 1.20.1 bootstrap active' "$LOG" \
            && grep -q 'MinecraftForge v47.4.10 Initialized' "$LOG" \
            && ! grep -Eqi 'Mixin apply failed|MixinTransformerError|InvalidMixinException|InjectionError|Injection validation failed|ExceptionInInitializerError|This crash report has been saved|Caught exception from RingWorld' "$LOG"; then
            echo 'Forge client stayed alive through bootstrap with the RingWorld client mixin set loaded.'
            exit 0
          fi
          echo "Client smoke failed or exited before the observation window (status=$status)."
          [[ -f "$LOG" ]] && tail -n 350 "$LOG"
          exit 1

      - name: Remove speculative empty region files from packaged test world
        if: always()
        shell: bash
        run: |
          if [[ -d forge1201/run-server/world ]]; then
            find forge1201/run-server/world -type f -name 'r.*.*.mca' -size 0 -print -delete
          fi

      - name: Upload diagnostic build and generated world
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ringworld-forge-1.20.1-diagnostic
          path: |
            forge1201/build/libs/*.jar
            forge1201/run-server/world
            forge1201/run-server/logs/latest.log
            forge1201/run-client/console.log
            forge1201/run-client/logs/
            forge1201/run-client/crash-reports/
          if-no-files-found: warn
