name: Forge 1.20.1 Backport CI

on:
  push:
    branches:
      - port/mc-1.20.1-forge
  workflow_dispatch:

concurrency:
  group: forge-1.20.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile Forge 1.20.1 target with Java 17 toolchain
        run: ./gradlew :forge1201:compileJava -PringBackportCompilerScope=forge1201 --dependency-verification=off --stacktrace --no-daemon
