name: Forge 1.20.1 Backport

on:
  push:
    branches:
      - port/mc-1.20.1-custom
    paths:
      - 'forge1201/**'
      - '.github/workflows/forge1201-build.yml'
  pull_request:
    paths:
      - 'forge1201/**'
      - '.github/workflows/forge1201-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Test ring topology core
        run: gradle -p forge1201 test --stacktrace

      - name: Build Forge jar
        run: gradle -p forge1201 build --stacktrace

      - name: Upload development jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ringworld-forge-1.20.1-alpha
          path: forge1201/build/libs/*.jar
          if-no-files-found: error
