name: Forge 1.20.1 Backport

on:
  push:
    branches:
      - port/mc-1.20.1-custom
    paths:
      - 'forge1201/**'
      - '.github/workflows/forge1201-build.yml'
  pull_request:
    paths:
      - 'forge1201/**'
      - '.github/workflows/forge1201-build.yml'
  workflow_dispatch:

concurrency:
  group: forge1201-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Test ring topology core
        run: gradle -p forge1201 test --stacktrace

      - name: Build Forge jar
        run: gradle -p forge1201 build --stacktrace

      - name: Boot dedicated server and load worldgen mixins
        shell: bash
        run: |
          mkdir -p forge1201/run
          printf 'eula=true\n' > forge1201/run/eula.txt
          set +e
          timeout 90s gradle -p forge1201 runServer --console=plain --args='nogui' \
            > forge1201/run/smoke-server.log 2>&1
          status=$?
          set -e
          cat forge1201/run/smoke-server.log
          if grep -q 'Done (' forge1201/run/smoke-server.log; then
            echo 'Forge dedicated-server smoke test reached the ready state.'
            exit 0
          fi
          echo "Dedicated server did not reach ready state; gradle status=${status}."
          exit 1

      - name: Upload server smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ringworld-forge-1.20.1-smoke-log
          path: forge1201/run/smoke-server.log
          if-no-files-found: ignore

      - name: Upload development jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ringworld-forge-1.20.1-alpha
          path: forge1201/build/libs/*.jar
          if-no-files-found: error
